spring.application.name=capacity-connect

spring.datasource.url=jdbc:mysql://localhost:3306/capacity-connect?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=luckyadmin@123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Gemini AI Integration
# Configure via GEMINI_API_KEY environment variable or in application-local.properties
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.8-flash}

spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties
