spring.application.name=capacity-connect

# Server Port (Render provides dynamic PORT, defaults to 8081 locally)
server.port=${PORT:8081}

# Database Connection (Uses environment variables if provided, otherwise defaults to local MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/capacity-connect?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:luckyadmin@123}

# Hibernate / JPA (Dialect is auto-detected for PostgreSQL vs MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# Gemini AI Integration
# Configure via GEMINI_API_KEY environment variable or in application-local.properties
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_API_MODEL:gemini-3.8-flash}

spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties
