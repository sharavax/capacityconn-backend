# ==============================================================================
# Render Blueprint Infrastructure-as-Code (render.yaml)
# Defines both the PostgreSQL database and the Spring Boot Docker web service
# ==============================================================================

databases:
  - name: capacity-connect-db
    databaseName: capacity_connect
    user: capacity_user
    plan: free
    region: oregon

services:
  - type: web
    name: capacity-connect-backend
    runtime: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: capacity-connect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: capacity-connect-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: capacity-connect-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: capacity-connect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: capacity-connect-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: capacity-connect-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_MODEL
        value: gemini-3.8-flash
